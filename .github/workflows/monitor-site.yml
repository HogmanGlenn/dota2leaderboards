name: Monitor site publishing

on:
  workflow_run:
    workflows: [Refresh leaderboard data, Build and deploy GitHub Pages]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test alert without changing the website
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test health checks and incident handling
        run: node scripts/test_site_health.js

      - name: Check publishing and notify the owner
        uses: actions/github-script@v9
        with:
          script: |
            await require('./scripts/site_health.js').monitor({ github, context, core });
